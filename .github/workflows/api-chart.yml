name: API & Chart

on:
  pull_request:
  push:
    branches: [main]

jobs:
  api:
    name: OpenAPI spec
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python dependencies
        run: pip install pyyaml
      - name: Shell syntax
        run: |
          for script in scripts/*.sh scripts/lib/*.sh; do
            bash -n "$script"
          done
      - name: Python regression tests
        run: python3 -B -m unittest discover -s tests -p 'test_*.py' -v
      - name: Validate OpenAPI spec
        run: python3 scripts/lib/validate_openapi.py api/openapi.yaml

  chart:
    name: Helm chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the pinned Helm CLI
        run: ./scripts/platform.sh tools

      - name: Chart regression tests
        run: ./scripts/check-chart.sh
