name: API & Chart
on:
  pull_request:
  push:
    branches: [main]
jobs:
  api:
    name: OpenAPI spec
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r tests/requirements.txt
      - name: Syntax, Python regressions and full API validation
        run: python3 -B tests/run.py unit --suite syntax --suite python --suite api
  chart:
    name: Helm chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -B tests/run.py unit --suite chart
