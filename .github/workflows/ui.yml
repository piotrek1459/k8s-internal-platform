name: UI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  check:
    name: Type-check / Lint / Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: python3 -B tests/run.py unit --suite ui
