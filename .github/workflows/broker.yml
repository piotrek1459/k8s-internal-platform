name: Broker
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    name: Format / Vet / Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: broker/go.mod
          cache-dependency-path: broker/go.sum
      - run: python3 -B tests/run.py unit --suite broker
  demo:
    name: HTTP demo regression tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: examples/http-demo/go.mod
          cache: false
      - run: python3 -B tests/run.py unit --suite demo
