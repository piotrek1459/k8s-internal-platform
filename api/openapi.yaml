# Management API contract for the Kubernetes application-deployment platform.
#
# This schema documents the implemented core/lifecycle API and credential
# metadata and bounded application diagnostics. Settings, automation tokens, application
# volumes and observability endpoints remain planned. Current implementation
# remaining boundaries are recorded in docs/status.md; fixed contracts
# are distinguished from planned features and host-specific acceptance.
#
# Management routes use session cookies except setup/login and health probes.
# State-changing requests require X-Requested-With. Application lifecycle
# mutations also require Idempotency-Key; existing applications require the
# current integer version in the JSON body. If-Match is not enforced.
# Accepted application mutations return 202 and an operation Location.
openapi: 3.1.0
info:
  title: Kubernetes application-deployment platform API
  version: 0.2.0
  description: >-
    Management API for a single administrator operating one Kubernetes cluster.
    Includes authentication, applications and lifecycle operations, image
    inspection, operations, configuration Secrets and registry credential metadata.
    State-changing requests require X-Requested-With. Execution snapshots,
    restart tokens, private registry credentials and verified restoration are
    implemented. Ambiguous recovery retains a mutation lock; see docs/status.md.
  license:
    name: See repository LICENSE
servers:
  - url: /
tags:
  - name: health
  - name: setup
  - name: auth
  - name: system
  - name: images
  - name: applications
  - name: operations
  - name: secrets
  - name: registry-credentials
  - name: diagnostics

paths:
  /healthz:
    get:
      tags: [health]
      summary: Process liveness
      security: []
      responses:
        "200":
          description: The process is running.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthStatus" }

  /readyz:
    get:
      tags: [health]
      summary: API readiness with separate cluster connectivity
      description: >-
        Reports that the API can serve requests. Cluster connectivity is reported
        separately and does not by itself fail readiness, so the API remains
        usable to inspect and recover applications while the cluster is degraded.
      security: []
      responses:
        "200":
          description: The API is ready to serve.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReadyStatus" }

  /api/v1/setup/status:
    get:
      tags: [setup]
      summary: Whether initial administrator setup is available
      security: []
      responses:
        "200":
          description: Setup availability.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SetupStatus" }

  /api/v1/setup:
    post:
      tags: [setup]
      summary: Create the administrator using the single-use bootstrap token
      description: >-
        Consumes the single-use, expiring bootstrap token presented to the local
        administrator at installation. Succeeds once; the token is then spent.
      security:
        - bootstrapToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SetupRequest" }
      responses:
        "201": { description: Administrator created. }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409":
          description: Setup already completed or token already consumed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorBody" }

  /api/v1/auth/session:
    post:
      tags: [auth]
      summary: Authenticate and establish a session
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "204":
          description: Session established; a HttpOnly session cookie is set.
          headers:
            Set-Cookie:
              schema: { type: string }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
    delete:
      tags: [auth]
      summary: Revoke the current session
      responses:
        "204": { description: Session revoked. }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }

  /api/v1/auth/me:
    get:
      tags: [auth]
      summary: Current administrator and session summary
      responses:
        "200":
          description: Current session.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "401": { $ref: "#/components/responses/Error" }

  /api/v1/system:
    get:
      tags: [system]
      summary: Version, architecture, cluster reachability and capability names
      responses:
        "200":
          description: System summary.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/System" }
        "401": { $ref: "#/components/responses/Error" }

  /api/v1/images/inspect:
    post:
      tags: [images]
      summary: Inspect an image reference and optional credential
      description: >-
        Reports architecture, resolved digest, and a suggested port. Advisory for
        the creation form. The worker resolves a newly selected tag and freezes
        its digest before mutation; an already pinned image is reused. Stored
        private registry credential authentication is not yet wired end to end.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ImageInspectRequest" }
      responses:
        "200":
          description: Inspection result.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImageReport" }
        "401": { $ref: "#/components/responses/Error" }
        "422":
          description: Unsupported image (for example IMAGE_ARCH_UNSUPPORTED).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorBody" }
        "503":
          description: Registry temporarily unavailable; retryable.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorBody" }

  /api/v1/apps:
    get:
      tags: [applications]
      summary: List applications with summarized status
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        "200":
          description: Paginated applications.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApplicationList" }
        "401": { $ref: "#/components/responses/Error" }
    post:
      tags: [applications]
      summary: Create an application and queue its installation
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateApplicationRequest" }
      responses:
        "202":
          description: Accepted; an operation has been queued.
          headers:
            Location:
              description: URL of the created operation.
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AcceptResult" }
        "401": { $ref: "#/components/responses/Error" }
        "409":
          description: Duplicate idempotency key with a different body, or a name conflict.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorBody" }
        "422":
          description: Unsupported specification.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorBody" }

  /api/v1/apps/{id}:
    parameters:
      - $ref: "#/components/parameters/AppID"
    get:
      tags: [applications]
      summary: Application configuration, observed status, active operation, and version
      responses:
        "200":
          description: Application detail. The ETag carries the current version.
          headers:
            ETag:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Application" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      tags: [applications]
      summary: Update image, configuration, resources, or replica count
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateApplicationRequest" }
      responses:
        "202": { $ref: "#/components/responses/Accepted" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "412": { $ref: "#/components/responses/Error" }
    delete:
      tags: [applications]
      summary: Delete an application and remove its workload from the cluster
      description: >-
        Requires the current application version and Idempotency-Key. A blocked
        first create operation in needs_attention with no successful predecessor
        may be superseded by tracked deletion. The failed candidate, frozen
        snapshot and history remain recorded; the lock transfers atomically to
        the delete operation until cleanup succeeds. Running work and unresolved
        updates of a previously successful application still return 409.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version]
              properties:
                version: { type: integer, description: "Optimistic lock version." }
      responses:
        "202": { $ref: "#/components/responses/Accepted" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "412": { $ref: "#/components/responses/Error" }

  /api/v1/apps/{id}/logs:
    parameters:
      - $ref: "#/components/parameters/AppID"
    get:
      tags: [diagnostics]
      summary: Read bounded recent logs from an owned application container
      description: >-
        Reads the application container only, with a Deployment/ReplicaSet/Pod UID
        ownership check. No arbitrary namespace, container, exec or follow option.
        Maximum returned text is 64 KiB. Known managed Secret values and supported
        encodings are masked before clipping; incomplete redaction inputs fail
        closed. Reads time out after ten seconds. Redaction does not recognize
        arbitrary application-defined secrets or every possible transformation.
      parameters:
        - { name: pod, in: query, schema: { type: string, maxLength: 253 }, description: "Optional owned Pod name; default is the newest active owned Pod." }
        - { name: previous, in: query, schema: { type: boolean, default: false } }
        - { name: tailLines, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 100 } }
        - { name: sinceSeconds, in: query, schema: { type: integer, minimum: 1, maximum: 86400, default: 3600 } }
      responses:
        "200":
          description: Bounded plain text with source and truncation metadata.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApplicationLogs" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }

  /api/v1/apps/{id}/events:
    parameters:
      - $ref: "#/components/parameters/AppID"
    get:
      tags: [diagnostics]
      summary: Read bounded Kubernetes events for current owned resource UIDs
      description: >-
        Separate from durable operation progress. Current Deployment, ReplicaSet,
        Pod, Service and Ingress ownership is verified; events for unrelated UIDs
        are excluded. Retention is Kubernetes-managed. Per-resource/read limits
        can omit events; truncated is reported explicitly. Text is masked before
        clipping, limited to 4096 bytes per field and 64 KiB overall.
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
      responses:
        "200":
          description: Most recent retained events within the bounded read.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApplicationEvents" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }

  /api/v1/apps/{id}/drift:
    parameters:
      - $ref: "#/components/parameters/AppID"
    get:
      tags: [diagnostics]
      summary: Compare owned workload and route fields with frozen desired intent
      description: >-
        Read-only comparison against the available recorded chart/values snapshot.
        Differences contain resource identifiers and field paths, never values.
        Readiness and server-allocated addresses are not configuration drift.
        Active operations are identified; intent changes during inspection return
        409. Reapply remains an explicit mutation. Unknown ownership is reported
        without adopting or overwriting the object.
      responses:
        "200":
          description: Snapshot identity, observation time and owned field differences.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApplicationDrift" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }

  /api/v1/apps/{id}/revisions:
    parameters:
      - $ref: "#/components/parameters/AppID"
    get:
      tags: [applications]
      summary: Ordered revision history for an application
      responses:
        "200":
          description: Revision list, newest first.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RevisionList" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /api/v1/apps/{id}/restart:
    parameters:
      - $ref: "#/components/parameters/AppID"
    post:
      tags: [applications]
      summary: Restart an application with its current spec unchanged
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VersionBody" }
      responses:
        "202": { $ref: "#/components/responses/Accepted" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "412": { $ref: "#/components/responses/Error" }

  /api/v1/apps/{id}/recover:
    parameters:
      - $ref: "#/components/parameters/AppID"
    post:
      tags: [applications]
      summary: Retry an existing blocked operation after its cause is addressed
      description: >-
        Requires the current application version, reuses the blocked operation ID
        and increments the application version. No new specification is accepted.
        Idempotency-Key is not required: the version guard prevents duplicate retry.
        Pending or still ambiguous Helm state remains blocked.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VersionBody" }
      responses:
        "202": { $ref: "#/components/responses/Accepted" }
        "401": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "412": { $ref: "#/components/responses/Error" }

  /api/v1/apps/{id}/reapply:
    parameters:
      - $ref: "#/components/parameters/AppID"
    post:
      tags: [applications]
      summary: Reapply the current desired spec to correct drift
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VersionBody" }
      responses:
        "202": { $ref: "#/components/responses/Accepted" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "412": { $ref: "#/components/responses/Error" }

  /api/v1/apps/{id}/rollback:
    parameters:
      - $ref: "#/components/parameters/AppID"
    post:
      tags: [applications]
      summary: Roll back to a prior succeeded revision
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RollbackRequest" }
      responses:
        "202": { $ref: "#/components/responses/Accepted" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "412": { $ref: "#/components/responses/Error" }

  /api/v1/operations/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      tags: [operations]
      summary: Durable operation progress, outcome, and recovery details
      responses:
        "200":
          description: Operation state and ordered events.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Operation" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /api/v1/secrets:
    get:
      tags: [secrets]
      summary: Secret metadata; values are never returned
      responses:
        "200":
          description: Secret metadata.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SecretList" }
        "401": { $ref: "#/components/responses/Error" }
    post:
      tags: [secrets]
      summary: Create a versioned secret before use in an application
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateSecretRequest" }
      responses:
        "201":
          description: Secret created with its first immutable version.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SecretMetadata" }
        "401": { $ref: "#/components/responses/Error" }

  /api/v1/secrets/{id}/versions:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      tags: [secrets]
      summary: Add an immutable replacement secret version
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SecretVersionRequest" }
      responses:
        "201":
          description: New immutable version created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SecretVersionMetadata" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /api/v1/secrets/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    delete:
      tags: [secrets]
      summary: Delete a secret after verifying no active or rollback references
      responses:
        "204": { description: Secret deleted. }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409":
          description: A referenced version prevents deletion (SECRET_IN_USE).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorBody" }

  /api/v1/registry-credentials:
    get:
      tags: [registry-credentials]
      summary: List registry credential metadata
      description: Passwords are stored only in Kubernetes Docker configuration Secrets and are never returned.
      responses:
        "200":
          description: Credential metadata.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RegistryCredentialList" }
        "401": { $ref: "#/components/responses/Error" }
    post:
      tags: [registry-credentials]
      summary: Create registry credential metadata
      description: >-
        Stores authentication in an immutable Kubernetes image-pull Secret and metadata
        in SQLite. Inspection uses the same credential, scoped to its registry host.
        Creation does not claim successful verification of the supplied password.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateRegistryCredentialRequest" }
      responses:
        "201":
          description: Metadata created; private authentication is not configured.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RegistryCredentialMetadata" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }

  /api/v1/registry-credentials/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    delete:
      tags: [registry-credentials]
      summary: Delete registry credential metadata
      description: The current metadata deletion does not establish dependency-aware credential cleanup.
      responses:
        "204": { description: Credential metadata deleted. }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: platform_session
    bootstrapToken:
      type: http
      scheme: bearer
      description: Single-use bootstrap token presented to the local administrator.

  parameters:
    AppID:
      name: id
      in: path
      required: true
      schema: { type: string }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Deduplicates retried submissions of the same mutation.
      schema: { type: string, minLength: 1, maxLength: 200 }

  responses:
    Error:
      description: Standard error envelope.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorBody" }
    Accepted:
      description: Mutation accepted; poll the Location URL for outcome.
      headers:
        Location:
          schema: { type: string }
          description: URL of the created operation.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/AcceptResult" }

  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [ok] }

    ReadyStatus:
      type: object
      required: [status, cluster]
      properties:
        status: { type: string, enum: [ready] }
        cluster: { type: string, enum: [available, unavailable, unknown] }

    SetupStatus:
      type: object
      required: [setupAvailable]
      properties:
        setupAvailable: { type: boolean }

    SetupRequest:
      type: object
      additionalProperties: false
      required: [password]
      properties:
        password: { type: string, minLength: 12, maxLength: 256 }

    LoginRequest:
      type: object
      additionalProperties: false
      required: [password]
      properties:
        password: { type: string, minLength: 1, maxLength: 256 }

    Me:
      type: object
      required: [administratorId, sessionExpiresAt]
      properties:
        administratorId: { type: string }
        sessionExpiresAt: { type: string, format: date-time }

    System:
      type: object
      required: [version, architecture, clusterReachable]
      properties:
        version: { type: string }
        architecture: { type: string, examples: [arm64, amd64] }
        clusterReachable: { type: boolean }
        capabilities:
          type: array
          items: { type: string }

    ImageInspectRequest:
      type: object
      additionalProperties: false
      required: [image]
      properties:
        image: { type: string, minLength: 1 }
        registryCredentialId: { type: string }

    ImageReport:
      type: object
      required: [digest, architectures]
      properties:
        digest: { type: string, examples: ["sha256:aaaa...."] }
        architectures:
          type: array
          items: { type: string }
        suggestedPort: { type: integer, minimum: 0, maximum: 65535, description: "Zero means no port hint." }

    ResourceRequirements:
      type: object
      additionalProperties: false
      properties:
        cpuRequest: { type: string }
        cpuLimit: { type: string }
        memoryRequest: { type: string }
        memoryLimit: { type: string }

    SecretRefInput:
      type: object
      additionalProperties: false
      required: [environmentVariable, secretId, version]
      properties:
        environmentVariable: { type: string, pattern: "^[a-zA-Z_][a-zA-Z0-9_]*$" }
        secretId: { type: string }
        version: { type: integer, minimum: 1 }

    Exposure:
      type: object
      additionalProperties: false
      required: [mode]
      properties:
        mode: { type: string, enum: [internal, lan] }
        hostname: { type: string }

    Health:
      type: object
      additionalProperties: false
      properties:
        startupPath: { type: string, pattern: "^(/.*)?$", description: "Optional independent HTTP startup path; omitted uses TCP." }
        readinessPath: { type: string, pattern: "^(/.*)?$" }

    CreateApplicationRequest:
      type: object
      additionalProperties: false
      required: [name, image, containerPort, profile, exposure]
      properties:
        name: { type: string, minLength: 1, maxLength: 63 }
        image: { type: string, minLength: 1 }
        registryCredentialId: { type: string }
        containerPort: { type: integer, minimum: 1, maximum: 65535 }
        profile: { type: string, enum: [http] }
        replicas: { type: integer, minimum: 0, default: 1 }
        environment:
          type: object
          additionalProperties: { type: string }
        secretRefs:
          type: array
          items: { $ref: "#/components/schemas/SecretRefInput" }
        resources: { $ref: "#/components/schemas/ResourceRequirements" }
        health: { $ref: "#/components/schemas/Health" }
        exposure: { $ref: "#/components/schemas/Exposure" }
        storage:
          description: Reserved for M5; must be null in the core prototype.
          type: ["null"]

    AcceptResult:
      type: object
      required: [applicationId, operationId, state]
      properties:
        applicationId: { type: string }
        operationId: { type: string }
        state: { $ref: "#/components/schemas/OperationState" }
        deduplicated: { type: boolean }

    ApplicationLogs:
      type: object
      required: [pod, container, text, truncated, observedAt]
      properties:
        pod: { type: string }
        container: { type: string }
        text: { type: string, maxLength: 65536 }
        truncated: { type: boolean }
        observedAt: { type: string, format: date-time }

    WorkloadEvent:
      type: object
      required: [at, type, reason, message, resource, count]
      properties:
        at: { type: string, format: date-time }
        type: { type: string, maxLength: 4096 }
        reason: { type: string, maxLength: 4096 }
        message: { type: string, maxLength: 4096 }
        resource: { type: string, maxLength: 4096 }
        count: { type: integer }

    ApplicationEvents:
      type: object
      required: [items, truncated, observedAt]
      properties:
        items: { type: array, maxItems: 100, items: { $ref: "#/components/schemas/WorkloadEvent" } }
        truncated: { type: boolean }
        observedAt: { type: string, format: date-time }

    ApplicationDrift:
      type: object
      required: [revisionId, applicationVersion, operationActive, state, differences, observedAt]
      properties:
        revisionId: { type: string }
        applicationVersion: { type: integer, format: int64 }
        operationActive: { type: boolean }
        state: { type: string, enum: [in_sync, drifted] }
        observedAt: { type: string, format: date-time }
        differences:
          type: array
          items:
            type: object
            required: [resource, field, change]
            properties:
              resource: { type: string }
              field: { type: string }
              change: { type: string, enum: [modified, missing, unexpected] }

    OperationState:
      type: string
      enum: [queued, running, recovering, succeeded, failed, needs_attention]

    ObservedStatus:
      description: >-
        CamelCase workload observation. A missing observation reports unknown and
        stale rather than an empty phase. Operation and workload states are separate.
      type: object
      required: [phase, observedAt, stale]
      properties:
        phase: { type: string, enum: [deploying, updating, ready, degraded, stopped, failed, unknown] }
        desiredReplicas: { type: integer }
        readyReplicas: { type: integer }
        observedGeneration: { type: integer, format: int64 }
        workloadReady: { type: boolean }
        routeReady: { type: boolean }
        observedAt: { type: string, format: date-time }
        stale: { type: boolean }

    Application:
      type: object
      required: [id, name, version, status]
      properties:
        id: { type: string }
        name: { type: string }
        version: { type: integer, format: int64 }
        desiredRevision: { type: string }
        lastSuccessfulRevision: { type: string }
        activeOperationId: { type: string }
        status: { $ref: "#/components/schemas/ObservedStatus" }

    ApplicationSummary:
      type: object
      required: [id, name, version]
      properties:
        id: { type: string }
        name: { type: string }
        version: { type: integer, format: int64 }
        phase: { type: string }

    ApplicationList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/ApplicationSummary" }

    OperationEvent:
      type: object
      required: [at, stage, message]
      properties:
        at: { type: string, format: date-time }
        stage: { type: string }
        message: { type: string }

    Operation:
      type: object
      required: [id, applicationId, type, state]
      properties:
        id: { type: string }
        applicationId: { type: string }
        type: { type: string, enum: [create, update, restart, reapply, rollback, delete] }
        state: { $ref: "#/components/schemas/OperationState" }
        stage: { type: string }
        recoveryOutcome: { type: string }
        events:
          type: array
          items: { $ref: "#/components/schemas/OperationEvent" }

    CreateSecretRequest:
      type: object
      additionalProperties: false
      required: [name, data]
      properties:
        name: { type: string, minLength: 1, maxLength: 253 }
        data:
          $ref: "#/components/schemas/SecretData"

    SecretVersionRequest:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/SecretData"

    SecretData:
      type: object
      additionalProperties: false
      required: [value]
      properties:
        value: { type: string }
      description: >-
        Write-only secret material under the single supported key "value", which
        the application chart references as secretKeyRef.key: value. Never
        returned by any read. A per-reference key selector is a later extension.

    SecretMetadata:
      type: object
      required: [id, name, versions]
      properties:
        id: { type: string }
        name: { type: string }
        versions:
          type: array
          items: { $ref: "#/components/schemas/SecretVersionMetadata" }

    SecretVersionMetadata:
      type: object
      required: [version, keys, createdAt]
      properties:
        version: { type: integer, minimum: 1 }
        keys:
          type: array
          items: { type: string }
        createdAt: { type: string, format: date-time }

    SecretList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/SecretMetadata" }

    CreateRegistryCredentialRequest:
      type: object
      additionalProperties: false
      required: [label, registry, username, password]
      properties:
        label: { type: string, minLength: 1 }
        registry: { type: string, minLength: 1 }
        username: { type: string, minLength: 1 }
        password:
          type: string
          minLength: 1
          writeOnly: true
          description: Write-only input stored in a Kubernetes Docker configuration Secret; absent from SQLite and ordinary responses.

    RegistryCredentialMetadata:
      type: object
      required: [id, label, registry, username, createdAt]
      properties:
        id: { type: string }
        label: { type: string }
        registry: { type: string }
        username: { type: string }
        createdAt: { type: string, format: date-time }

    RegistryCredentialList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/RegistryCredentialMetadata" }

    UpdateApplicationRequest:
      type: object
      additionalProperties: false
      required: [version]
      properties:
        version: { type: integer, format: int64, description: "Optimistic lock version." }
        image: { type: string, minLength: 1 }
        registryCredentialId: { type: string }
        containerPort: { type: integer, minimum: 1, maximum: 65535 }
        replicas: { type: integer, minimum: 0 }
        environment:
          type: object
          additionalProperties: { type: string }
        secretRefs:
          type: array
          items: { $ref: "#/components/schemas/SecretRefInput" }
        resources: { $ref: "#/components/schemas/ResourceRequirements" }
        health: { $ref: "#/components/schemas/Health" }
        exposure: { $ref: "#/components/schemas/Exposure" }

    VersionBody:
      type: object
      additionalProperties: false
      required: [version]
      properties:
        version: { type: integer, format: int64, description: "Optimistic lock version." }

    RollbackRequest:
      type: object
      additionalProperties: false
      required: [revisionId, version]
      properties:
        revisionId: { type: string, description: "ID of a prior succeeded revision." }
        version: { type: integer, format: int64, description: "Optimistic lock version." }

    RevisionSummary:
      type: object
      required: [id, number, result, createdAt]
      properties:
        id: { type: string }
        number: { type: integer, format: int64 }
        result: { type: string, enum: [pending, succeeded, failed] }
        frozenAt: { type: string, format: date-time }
        frozenImage: { type: string, description: "Recorded digest-pinned image when a snapshot exists." }
        createdAt: { type: string, format: date-time }
        spec:
          type: object
          properties:
            image: { type: string }
            replicas: { type: integer }

    RevisionList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/RevisionSummary" }

    ErrorBody:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, requestId]
          properties:
            code: { type: string }
            message: { type: string }
            field: { type: string }
            requestId: { type: string }

# All management endpoints require a session cookie unless they override security
# locally (health and the credential-protected setup/session entry points).
security:
  - sessionCookie: []
