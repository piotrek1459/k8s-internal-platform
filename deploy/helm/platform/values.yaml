# Platform broker chart values.
#
# The broker runs as a single replica with a Recreate strategy so only one
# process ever writes the SQLite metadata file on the PVC. It manages
# applications in a separate namespace (appsNamespace) through scoped RBAC.

image:
  repository: ghcr.io/piotrek1459/k8s-internal-platform
  # Pin by digest in a release; a tag is accepted for development installs.
  tag: ""
  digest: ""
  pullPolicy: IfNotPresent

# Namespace holding managed applications. The broker receives write access here
# and read-only access to selected cluster-scoped resources.
appsNamespace: platform-apps

# Persistent metadata volume for the SQLite database.
persistence:
  size: 1Gi
  # storageClassName empty uses the cluster default (local-path on K3s).
  storageClassName: ""

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi

# Private ClusterIP service port for the management API.
service:
  port: 80

# When true, the broker sets Secure on session cookies (enable behind HTTPS).
secureCookies: false

# Comma-separated list of registry host:port entries that speak plain HTTP
# (no TLS). Used for local k3d registries in development.
insecureRegistries: ""

# Comma-separated "from=to" pairs: rewrite registry host:port in image refs
# before inspection. Used when the image tag port differs from the in-cluster
# port (k3d maps host :5001 → container :5000).
registryAliases: ""

# Enable only after a private ingress controller and DNS have been configured.
privateIngressEnabled: false

# Optional, IPv4-only private HTTPS listener on a dedicated single-node host.
# Certificate/key material belongs in an existing Kubernetes TLS Secret.
privateLAN:
  enabled: false
  address: ""
  httpsPort: 8443
  allowedCIDRs: []
  managementHostname: ""
  applicationDomain: ""
  tlsSecretName: platform-private-tls
  # Traefik v3.7.19, multi-architecture Docker Official Image index.
  image: docker.io/library/traefik@sha256:a6c0194dda77bcb804824580f36fa7edc56e315b1acfe933366c8b52844a78a4
