apiVersion: v1
kind: Namespace
metadata:
  name: platform-apps
  labels:
    app.kubernetes.io/part-of: k8s-internal-platform
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: v1.36
---
# Provisional local-test budget, including a rolling-update surge pod.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: application-budget
  namespace: platform-apps
spec:
  hard:
    pods: "8"
    requests.cpu: "1"
    requests.memory: 512Mi
    limits.cpu: "2"
    limits.memory: 1Gi
